services:
  - type: web
    name: garage-master
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: garage-master-db
          property: connectionString
      - key: GEOCODE_DEFAULT_CITY
        value: "Ульяновск, Россия"
      - key: GEOCODE_USER_AGENT
        value: GarageMaster/1.0

databases:
  - name: garage-master-db
    plan: free
